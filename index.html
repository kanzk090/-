<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>كنزك | KANZAK</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
      --accent-pink: #f45d8b;
      --accent-hover: #d94874;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;
      --border-color: #333333;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); margin: 0; padding: 0; }
    .protected-mode { -webkit-user-select: none !important; -moz-user-select: none !important; -ms-user-select: none !important; user-select: none !important; -webkit-touch-callout: none !important; }
    #privacy-curtain { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: var(--accent-pink); z-index: 999999; justify-content: center; align-items: center; text-align: center; font-size: 20px; padding: 20px; }
    #auth-gateway { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .auth-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 28px 22px; width: 100%; max-width: 430px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); text-align: center; }
    .bismillah { color: var(--accent-pink); font-size: 15px; margin-bottom: 8px; font-weight: bold; }
    .app-title { font-size: 28px; margin: 0; color: #fff; }
    .app-title span { color: var(--accent-pink); font-size: 16px; display: block; letter-spacing: 2px; }
    .app-intro { color: var(--text-muted); font-size: 13.5px; line-height: 1.6; margin: 14px 0 22px; background: #161616; padding: 12px; border-radius: 10px; border-right: 3px solid var(--accent-pink); }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px; background: #262626; border: 1px solid var(--border-color); color: var(--text-muted); border-radius: 8px; cursor: pointer; font-weight: bold; }
    .tab-btn.active { background: var(--accent-pink); color: #fff; border-color: var(--accent-pink); }
    .form-group { text-align: right; margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; margin-bottom: 6px; color: #ddd; }
    .form-group input, .phone-row select { width: 100%; padding: 12px; background: #141414; border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
    .form-group input:focus { border-color: var(--accent-pink); }
    .phone-row { display: flex; gap: 8px; direction: ltr; }
    .phone-row select { width: 38%; }
    .phone-row input { width: 62%; }
    .btn-primary { width: 100%; padding: 13px; background: var(--accent-pink); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 8px; transition: 0.2s; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-whatsapp { background: #25D366; color: #fff; display: inline-block; width: 100%; padding: 13px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 15px; border: none; cursor: pointer; font-size: 15px; }
    #admin-panel { display: none; padding: 20px; max-width: 800px; margin: 0 auto; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 20px; }
    .user-request-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; }
    .user-info p { margin: 4px 0; font-size: 14px; }
    .badge { padding: 3px 8px; border-radius: 5px; font-size: 12px; font-weight: bold; }
    .badge-pending { background: #b45309; color: #fff; }
    .badge-active { background: #15803d; color: #fff; }
    .badge-rejected { background: #b91c1c; color: #fff; }
    .admin-actions { display: flex; gap: 10px; margin-top: 8px; }
    .btn-approve { flex: 1; padding: 8px; background: #16a34a; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-reject { flex: 1; padding: 8px; background: #dc2626; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-logout { background: #333; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
    .msg-box { font-size: 13px; margin-top: 10px; color: #ff6b6b; }
  </style>
</head>
